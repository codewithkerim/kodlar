<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bug Avcısı</title>
<meta name="theme-color" content="#121110">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@600&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#121110;touch-action:none;display:grid;place-items:center}canvas{display:block}</style>
</head>
<body>
<canvas id="oyun"></canvas>
<script>
function oyunOlustur(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, k = W / 400;
  const R = { zemin: '#121110', sari: '#ffd23d', turuncu: '#ff6a1a', krem: '#fff3c4', koyu: '#2b1f1a' };
  const yazi = (s, w = 800) => `${w} ${s * k}px 'Bricolage Grotesque', system-ui, sans-serif`;
  const mono = s => `600 ${s * k}px 'JetBrains Mono', ui-monospace, monospace`;
  const KOD = ['const app = express();', 'if (user.isAdmin) {', ' return res.json(data);', 'for (let i = 0; i < n; i++) {',
    'await db.save(order);', 'function render(props) {', 'console.log("çalışıyor mu?");', '// TODO: bunu düzelt',
    'let toplam = sepet.reduce(topla);', 'try { JSON.parse(veri) }', 'export default App;', 'while (!bitti) adim();'];
  let bocekler = [], puan = 0, sayac = 0, zaman = 0, kaydir = 0, tik = 0;

  let can = 3, kombo = 0, sonVurus = -9, bitti = false;

  let parcalar = [], yazilar = [], sarsinti = 0, flas = 0, ses = null;

  let ekran = 'giris', rekor = 0, yeniRekor = false;
  try { rekor = +localStorage.getItem('bugAvcisiRekor') || 0; } catch (e) {}

  function yeniBocek() {
    const b = { x: (40 + Math.random() * 320) * k, y: -30 * k, a: Math.PI / 2, v: (45 + Math.random() * 25) * k, t: Math.random() * 9, altin: false };

    b.v *= 1 + zaman * 0.035;
    b.altin = Math.random() < 0.1;

    bocekler.push(b);
  }

  function update(dt) {
    tik += dt;
    kaydir += dt * 26 * k;

    sarsinti = Math.max(0, sarsinti - dt);
    flas = Math.max(0, flas - dt);
    for (const p of parcalar) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * k * dt; p.o -= dt * 1.6; }
    parcalar = parcalar.filter(p => p.o > 0);
    for (const y of yazilar) { y.y -= 70 * k * dt; y.o -= dt * 1.2; }
    yazilar = yazilar.filter(y => y.o > 0);

    if (ekran !== 'oyun') return;

    if (bitti) return;

    zaman += dt;
    sayac -= dt;
    if (sayac <= 0) {
      sayac = 1.0 * Math.max(0.35, 1 - zaman * 0.025);
      yeniBocek();
    }
    for (const b of bocekler) {
      b.t += dt;
      b.a = Math.PI / 2 + Math.sin(b.t * 3) * 0.6;
      b.x = Math.min(W - 25 * k, Math.max(25 * k, b.x + Math.cos(b.a) * b.v * dt));
      b.y += Math.sin(b.a) * b.v * dt;
    }
    const kacanlar = bocekler.filter(b => b.y > H + 30 * k);
    bocekler = bocekler.filter(b => b.y <= H + 30 * k);

    for (const b of kacanlar) {
      can--;
      kombo = 0;

      sarsinti = 0.35;
      flas = 0.4;
      bip(110, 0.25, 'sawtooth');
      titret(60);
    }
    if (can <= 0 && !bitti) {
      bitti = true;

      yeniRekor = puan > rekor;
      if (yeniRekor) { rekor = puan; try { localStorage.setItem('bugAvcisiRekor', rekor); } catch (e) {} }
    }
  }

  function bocekCiz(b, s = 1) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.a - Math.PI / 2);
    ctx.scale(k * s, k * s);
    ctx.strokeStyle = R.koyu;
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    for (let i = -1; i <= 1; i++) for (const y of [-1, 1]) {
      const sallan = Math.sin(b.t * 18 + i * 2 + (y > 0 ? Math.PI : 0)) * 4;
      ctx.beginPath(); ctx.moveTo(y * 8, i * 7); ctx.lineTo(y * 19, i * 9 + sallan); ctx.stroke();
    }
    ctx.fillStyle = b.altin ? R.sari : R.turuncu;
    ctx.beginPath(); ctx.ellipse(0, -2, 12, 16, 0, 0, 7); ctx.fill();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, 13); ctx.stroke();
    ctx.fillStyle = R.koyu;
    for (const [x, y] of [[-5, -7], [5, -7], [-5, 4], [5, 4]]) { ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 16, 8, 0, 7); ctx.fill();
    ctx.fillStyle = R.krem;
    ctx.beginPath(); ctx.arc(-3, 19, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(3, 19, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3, 22); ctx.quadraticCurveTo(-8, 30, -11, 31); ctx.moveTo(3, 22); ctx.quadraticCurveTo(8, 30, 11, 31); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.save();

    if (sarsinti > 0) ctx.translate((Math.random() - 0.5) * 30 * k * sarsinti, (Math.random() - 0.5) * 30 * k * sarsinti);

    ctx.fillStyle = R.zemin;
    ctx.fillRect(-20 * k, -20 * k, W + 40 * k, H + 40 * k);
    ctx.font = mono(13);
    ctx.fillStyle = 'rgba(255,243,196,.08)';
    const sh = 26 * k, ilk = Math.floor(kaydir / sh);
    for (let i = 0; i < H / sh + 2; i++) {
      const n = ilk + i;
      ctx.fillText(String(n % 99 + 1).padStart(2, ' ') + ' ' + KOD[n % KOD.length], 14 * k, (i + 1) * sh - (kaydir % sh));
    }
    bocekler.forEach(b => bocekCiz(b));

    for (const p of parcalar) { ctx.globalAlpha = Math.max(0, p.o); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    ctx.textAlign = 'center';
    ctx.font = yazi(26);
    for (const y of yazilar) { ctx.globalAlpha = Math.max(0, y.o); ctx.fillStyle = y.c; ctx.fillText(y.s, y.x, y.y); }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    if (flas > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      g.addColorStop(0, 'rgba(255,40,40,0)');
      g.addColorStop(1, `rgba(255,40,40,${flas})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = R.krem;
    ctx.font = mono(12);
    ctx.fillText('PUAN', 20 * k, 38 * k);
    ctx.fillStyle = '#fff';
    ctx.font = yazi(40);
    ctx.fillText(puan, 20 * k, 78 * k);

    ctx.textAlign = 'right';
    ctx.fillStyle = R.krem;
    ctx.font = mono(12);
    ctx.fillText('SİSTEM', W - 20 * k, 38 * k);
    ctx.textAlign = 'left';
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < can ? R.sari : 'rgba(255,243,196,.15)';
      ctx.beginPath(); ctx.roundRect(W - 104 * k + i * 30 * k, 50 * k, 24 * k, 12 * k, 4 * k); ctx.fill();
    }
    if (kombo >= 2) {
      ctx.fillStyle = R.sari;
      ctx.font = yazi(22);
      ctx.fillText('x' + Math.min(kombo, 5) + ' KOMBO', 20 * k, 110 * k);
    }
    if (bitti) {
      ctx.fillStyle = 'rgba(18,17,16,.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = R.turuncu;
      ctx.font = yazi(50);
      ctx.fillText('KOD ÇÖKTÜ', W / 2, H * 0.42);
      ctx.fillStyle = '#fff';
      ctx.font = yazi(30);
      ctx.fillText('Skor: ' + puan, W / 2, H * 0.5);

      ctx.fillStyle = R.sari;
      ctx.font = yazi(22);
      ctx.fillText(yeniRekor ? '🏆 Yeni rekor!' : 'Rekor: ' + rekor, W / 2, H * 0.56);

      ctx.fillStyle = R.krem;
      ctx.font = mono(14);
      ctx.fillText('tekrar oynamak için dokun', W / 2, H * 0.64);
      ctx.textAlign = 'left';
    }

    if (ekran === 'giris') girisCiz();

    ctx.restore();
  }

  function girisCiz() {
    ctx.fillStyle = 'rgba(18,17,16,.88)';
    ctx.fillRect(0, 0, W, H);
    bocekCiz({ x: W / 2, y: H * 0.3 + Math.sin(tik * 2) * 8 * k, a: Math.PI / 2 + Math.sin(tik * 3) * 0.3, t: tik, altin: true }, 2.6);
    ctx.textAlign = 'center';
    ctx.font = yazi(64);
    ctx.fillStyle = '#fff';
    ctx.fillText('BUG', W / 2, H * 0.49);
    ctx.fillStyle = R.sari;
    ctx.fillText('AVCISI', W / 2, H * 0.49 + 60 * k);
    ctx.fillStyle = R.krem;
    ctx.font = mono(15);
    if (Math.floor(tik * 2) % 2 === 0) ctx.fillText('başlamak için dokun', W / 2, H * 0.68);
    ctx.fillStyle = 'rgba(255,243,196,.6)';
    ctx.font = mono(13);
    ctx.fillText('Rekor: ' + rekor, W / 2, H * 0.73);
    ctx.fillText('@codewithkerim', W / 2, H - 30 * k);
    ctx.textAlign = 'left';
  }

  function sifirla() {
    bocekler = []; puan = 0; zaman = 0; sayac = 0; can = 3; kombo = 0; bitti = false;

    yeniRekor = false;
  }

  function bip(frekans, sure, tip) {
    try {
      ses = ses || new AudioContext();
      const o = ses.createOscillator(), g = ses.createGain();
      o.type = tip;
      o.frequency.value = frekans;
      g.gain.setValueAtTime(0.08, ses.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ses.currentTime + sure);
      o.connect(g).connect(ses.destination);
      o.start();
      o.stop(ses.currentTime + sure);
    } catch (e) {}
  }
  function titret(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function tap(x, y) {
    if (ekran === 'giris') { ekran = 'oyun'; return; }

    if (bitti) { sifirla(); return; }

    const b = bocekler.find(b => Math.hypot(b.x - x, b.y - y) < 32 * k);
    if (!b) return;
    bocekler.splice(bocekler.indexOf(b), 1);
    let kazanc = 10;

    kombo = tik - sonVurus < 1.2 ? kombo + 1 : 1;
    sonVurus = tik;
    kazanc = (b.altin ? 50 : 10) * Math.min(kombo, 5);

    puan += kazanc;

    for (let i = 0; i < 18; i++) {
      const a = Math.random() * 7, h = 300 * k * (0.4 + Math.random());
      parcalar.push({ x: b.x, y: b.y, vx: Math.cos(a) * h, vy: Math.sin(a) * h - 150 * k, r: (2 + Math.random() * 4) * k, c: Math.random() < 0.5 ? R.sari : R.turuncu, o: 1 });
    }
    yazilar.push({ x: b.x, y: b.y - 20 * k, s: '+' + kazanc, c: b.altin ? R.sari : '#fff', o: 1 });
    bip(b.altin ? 1200 : 660 + Math.min(kombo, 5) * 80, 0.08, 'square');
    titret(15);
  }

  return { update, draw, tap, get bocekler() { return bocekler; } };
}
</script>
<script>
const cv = document.getElementById('oyun');
const dpr = Math.min(devicePixelRatio || 1, 2);
const w = Math.min(innerWidth, innerHeight * 9 / 16), h = innerHeight;
cv.style.width = w + 'px'; cv.style.height = h + 'px';
cv.width = w * dpr; cv.height = h * dpr;
let oyun;
document.fonts.load("800 20px 'Bricolage Grotesque'").finally(() => {
  oyun = oyunOlustur(cv);
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    oyun.tap((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
  });
  let once = performance.now();
  (function dongu(simdi) {
    oyun.update(Math.min(0.05, (simdi - once) / 1000));
    once = simdi;
    oyun.draw();
    requestAnimationFrame(dongu);
  })(once);
});
</script>
</body>
</html>
